services:
  wood-ring-showcase:
    image: nginx:1.27-alpine
    container_name: wood-ring-showcase
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private-net

networks:
  private-net:
    external: true
